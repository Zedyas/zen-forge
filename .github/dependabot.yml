# Monthly dependency update pull requests, grouped so there is one to review per ecosystem.
# A new version is proposed only after it has been public for 7 days (a hijacked release is
# usually pulled by then). Security fixes skip the wait and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Patched for this version (patches/); an update has to re-apply the patch by hand.
      - dependency-name: "@glideapps/glide-data-grid"
