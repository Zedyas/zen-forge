# Builds the macOS app and creates a draft GitHub Release when a v* tag is pushed.
# Run it by hand (Actions → Release → Run workflow) to build and download the .dmg without releasing.
#
# Two jobs, least privilege: `build` runs third-party code (dependency install and build) with a
# read-only token; `release` holds write access but only attests and uploads the finished files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release is always built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm release:mac
        env:
          # Ad-hoc signing only; do not look for a certificate in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Zen Suzu was called Zendo before 0.2.1, and the Zendo 0.2.0 updater only finds a file named
      # Zendo-<version>-arm64.dmg. A copy under that name lets 0.2.0 update. Remove once 0.2.1 is out.
      - name: Copy the .dmg under its old name
        working-directory: dist
        run: for dmg in Zen-Suzu-*.dmg; do cp "$dmg" "Zendo-${dmg#Zen-Suzu-}"; done
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zen-suzu-mac
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            .github/release-notes.md
          # The release notes live in .github/, which uploads skip unless hidden files are allowed.
          include-hidden-files: true
          retention-days: 7

  # On manual runs this job only checks that the build's files arrived; attesting and releasing need a tag.
  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zen-suzu-mac
      - name: Check the files arrived
        run: ls -l dist/*.dmg dist/SHA256SUMS.txt .github/release-notes.md
      # Records that the .dmg was built by this workflow from this tag's commit.
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Pre-release until builds are notarized by Apple.
        run: gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt --draft --prerelease --title "Zen Suzu ${TAG#v}" --notes-file .github/release-notes.md
