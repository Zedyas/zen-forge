# Builds the macOS app and creates a draft GitHub Release when a v* tag is pushed.
# Run it by hand (Actions → Release → Run workflow) to build and download the .dmg without releasing.
#
# Two jobs, least privilege: `build` runs third-party code (dependency install and build) with a
# read-only token; `release` holds write access but only attests and uploads the finished files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release is always built from a clean install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm release:mac
        env:
          # Ad-hoc signing only; do not look for a certificate in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 Zendo-*.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zendo-mac
          path: |
            dist/Zendo-*.dmg
            dist/SHA256SUMS.txt
            .github/release-notes.md
          # The release notes live in .github/, which uploads skip unless hidden files are allowed.
          include-hidden-files: true
          retention-days: 7

  # On manual runs this job only checks that the build's files arrived; attesting and releasing need a tag.
  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zendo-mac
      - name: Check the files arrived
        run: ls -l dist/Zendo-*.dmg dist/SHA256SUMS.txt .github/release-notes.md
      # Records that the .dmg was built by this workflow from this tag's commit.
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Zendo-*.dmg
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Pre-release until builds are notarized by Apple.
        run: gh release create "$TAG" dist/Zendo-*.dmg dist/SHA256SUMS.txt --draft --prerelease --title "Zendo ${TAG#v}" --notes-file .github/release-notes.md
