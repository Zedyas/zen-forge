# Builds the macOS app and creates a draft GitHub Release when a v* tag is pushed.
# Run it by hand (Actions → Release → Run workflow) to build and download the .dmg without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS build
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm release:mac
        env:
          # Ad-hoc signing only; do not look for a certificate in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 Zendo-*.dmg > SHA256SUMS.txt

      # Manual runs: keep the build as a downloadable workflow artifact.
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zendo-mac
          path: |
            dist/Zendo-*.dmg
            dist/SHA256SUMS.txt
          retention-days: 7

      # Tags: record where the .dmg came from, then create the draft release.
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Zendo-*.dmg
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Pre-release until builds are notarized by Apple.
        run: gh release create "$TAG" dist/Zendo-*.dmg dist/SHA256SUMS.txt --draft --prerelease --title "Zendo ${TAG#v}" --notes-file .github/release-notes.md
