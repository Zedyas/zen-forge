name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Where?
      options: [Ledger (spreadsheets), Hanko (PDF), Sumi (documents), Slides (presentations), Home or tabs, Installing or opening Zen Suzu]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zen Suzu and macOS versions
      description: Zen Suzu → About Zen Suzu shows the version.
      placeholder: Zen Suzu 0.2.1, macOS 26.0
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File
      description: Attach the file if you can share it, or describe what's in it (formulas, form fields, redactions). Remove anything private first.
