# Packages Zen Suzu for macOS. `pnpm package:mac` builds "dist/mac-arm64/Zen Suzu.app" to try locally;
# `pnpm release:mac` builds the downloadable dist/Zen-Suzu-<version>-arm64.dmg (the release workflow runs it).
# The file associations are what let Finder open spreadsheets, PDFs, documents and presentations in Zen Suzu ("Open With", default app).
# Reverse-DNS under the owner's GitHub name (zedyas.github.io); Zen Suzu has no domain of its own.
appId: io.github.zedyas.zensuzu
productName: Zen Suzu
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # Vite bundles everything the renderer uses and main needs only Electron and Node built-ins,
  # so node_modules would be ~165 MB of dead weight inside the app.
  - "!node_modules/**"
# Zen Suzu's license, Electron's and Chromium's, and third-party notices (scripts/third-party-notices.mjs).
extraResources:
  - from: out/licenses
    to: licenses
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
  # No space in the file name. The updater looks for this name (suiteFileName in src/shared/applications.ts).
  artifactName: Zen-Suzu-${version}-${arch}.${ext}
  # Ad-hoc signature: the app runs, and a downloaded copy opens after System Settings → Privacy &
  # Security → Open Anyway. Opening without that step needs a Developer ID certificate and notarization.
  # Hardened runtime would reject Electron's differently-signed frameworks under an ad-hoc identity.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Zed Y. Licensed under GPL-3.0.
# Electron fuses: switches written into the app binary. They stop the signed app from being reused
# as a general Node.js runtime and make it load only its own, integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
fileAssociations:
  - ext: [xlsx, csv, tsv]
    name: Spreadsheet
    role: Editor
  - ext: xlsm
    name: Macro-enabled workbook
    role: Viewer
  - ext: xls
    name: Excel 97-2003 workbook
    role: Viewer
  - ext: ods
    name: OpenDocument spreadsheet
    role: Viewer
  - ext: numbers
    name: Numbers spreadsheet
    role: Viewer
  - ext: pdf
    name: PDF document
    role: Editor
  - ext: docx
    name: Word document
    role: Editor
  - ext: [md, markdown]
    name: Markdown document
    role: Editor
  - ext: pptx
    name: PowerPoint presentation
    role: Editor
